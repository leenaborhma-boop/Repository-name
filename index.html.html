<style>

}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.shade{position:fixed;inset:0;pointer-events:none;

.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);

.top{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.top .note{text-align:right;min-width:0}
.copy{max-width:760px;min-width:0}
.tag{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;font-variant-numeric:tabular-nums}

.nav{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:18px;pointer-events:auto}

.dots button{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:rgba(246,239,228,.28);cursor:pointer;transition:transform .3s,background .3s}
.dots button[aria-current="true"]{background:var(--accent);transform:scale(1.4)}
.btns{display:flex;gap:10px}

.fallback{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:1.1rem;color:var(--muted)}
@media (max-width:520px){.top .note{font-size:10px}}

(function(){

var floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x1d1814,roughness:.92}));

/* paper */
function paperTex(){

var pt=paperTex();

/* helpers */
var V=function(x,y,z){return new THREE.Vector3(x,y,z);};
var GR=0x2b2c31,BLUE=0x2f5bff,RED=0xe0314b,TEAL=0x10b5a3,AMB=0xf2a516,VIO=0x8348e6,PINK=0xff7eb6;

var rad=function(s){return .055*Math.max(.55,s);};

}
function merge(){var r={strokes:[],pops:[]};for(var i=0;i<arguments.length;i++){r.strokes=r.strokes.concat(arguments[i].strokes);r.pops=r.pops.concat(arguments[i].pops);}return r;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

var EXT={depth:.32,bevelEnabled:true,bevelThickness:.07,bevelSize:.07,bevelSegments:5,curveSegments:28};

/* doodle builders: (ox,oz,s,sp) */
function spiral(ox,oz,s,sp,col){

  return {strokes:[stroke(pts,{r:rad(s),color:col,dur:3.2*sp})],pops:[mkPop(ball,ox,.28*s+.14,oz,false)]};
}
var LET={
  A:[[-.5,.7],[0,-.7],[.5,.7],[.28,.2],[-.28,.2]],
  J:[[-.2,-.7],[.45,-.7],[.15,-.7],[.15,.4],[0,.7],[-.3,.5]],
  M:[[-.5,.7],[-.5,-.7],[0,.1],[.5,-.7],[.5,.7]]

function letter(ch,ox,oz,s,sp,col){
  var pts=LET[ch].map(function(p){return V(ox+p[0]*s,.1*s+.04,oz+p[1]*s);});
  return {strokes:[stroke(dens(pts,5),{r:rad(s)*1.5,color:col,dur:.9*sp})],pops:[]};
}
function initials(sp){
  var r=[],cs=[BLUE,RED,TEAL,GR,VIO,AMB];
  for(var i=0;i<3;i++){r.push(letter('A',-2.4+i*1.7,-1.1,.95,sp,cs[i]));}
  for(var j=0;j<3;j++){r.push(letter('J',-2.4+j*1.7,1.15,.95,sp,cs[3+j]));}

}
function wave(x0,x1,z0,amp,ph,col,dur,s){
  var pts=[],N=90;
  for(var i=0;i<=N;i++){var x=x0+(x1-x0)*i/N,u=x*1.8/ (s||1)+ph;pts.push(V(x,.1*s+.12*s*(1+Math.sin(u+1)),z0+amp*Math.sin(u)));}

}
function waves(sp){
  return merge(wave(-3.5,3.5,-1.5,.55,0,TEAL,1.8*sp,1),wave(-3.5,3.5,0,.55,1.4,VIO,1.8*sp,1),wave(-3.5,3.5,1.5,.55,2.8,AMB,1.8*sp,1));

function geometric(ox,oz,s,sp){
  var d=2.4*s,st=[],pops=[];
  var sq=[[-.75,-.75],[.75,-.75],[.75,.75],[-.75,.75],[-.75,-.75]];
  var tri=[[0,-.85],[.9,.7],[-.9,.7],[0,-.85]];
  var hex=[];for(var i=0;i<=6;i++){hex.push([Math.cos(i*Math.PI/3)*.85,Math.sin(i*Math.PI/3)*.85]);}
  [[sq,-d,BLUE],[tri,0,TEAL],[hex,d,VIO]].forEach(function(o){
    var pts=o[0].map(function(p){return V(ox+o[1]+p[0]*s,.06*s+.03,oz+p[1]*s);});
    st.push(stroke(dens(pts,6),{r:rad(s),color:o[2],dur:1.1*sp}));
  });
  var cube=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2),glossMat(BLUE));cube.rotation.set(.5,.6,0);cube.scale.setScalar(s);

function hearts(ox,oz,s,sp){
  var d=2.5*s,k=.075*s,st=[],pops=[];
  var hp=[];for(var i=0;i<=64;i++){var h=heartXY(i/64*Math.PI*2);hp.push(V(ox-d+h[0]*k,.06*s+.03,oz-(h[1]-2)*k));}

  var fp=[];for(var j=0;j<=90;j++){var th=j/90*Math.PI*2,r=Math.cos(2*th)*1.0*s;fp.push(V(ox+Math.cos(th)*r,.06*s+.03,oz+Math.sin(th)*r));}

function scribble(ox,oz,w,h,seed,sp,s,cols){
  var R=rng(seed),st=[];

    var x=(R()-.5)*w,z=(R()-.5)*h,a=R()*6.28,pts=[];

function loops(sp){
  var pts=[];
  for(var i=0;i<=140;i++){var t=i/140*5*Math.PI;pts.push(V(-3.3+.4*(t-1.6*Math.sin(t)),.06,-.4*1.6*Math.cos(t)*.9+.2));}

function knot(x,y,z){

function loops2(sp){

function overlapping(ox,oz,s,sp){

function shading(ox,oz,s,sp){

/* pencil */
function makePencil(){
  var g=new THREE.Group();
  function add(geo,mat,y,rx){var m=new THREE.Mesh(geo,mat);m.position.y=y;if(rx)m.rotation.x=rx;g.add(m);return m;}
  add(new THREE.CylinderGeometry(.1,.1,2.6,6),new THREE.MeshStandardMaterial({color:0xf3b800,roughness:.4}),1.67);
  add(new THREE.ConeGeometry(.1,.38,6),new THREE.MeshStandardMaterial({color:0xe7c394,roughness:.8}),.19,Math.PI);
  add(new THREE.ConeGeometry(.035,.14,8),new THREE.MeshStandardMaterial({color:0x2b2c31,roughness:.4,metalness:.5}),.07,Math.PI);
  add(new THREE.CylinderGeometry(.106,.106,.22,16),new THREE.MeshStandardMaterial({color:0xc9ccd1,roughness:.25,metalness:.9}),3.06);
  add(new THREE.CylinderGeometry(.096,.096,.28,16),new THREE.MeshStandardMaterial({color:0xf09ab0,roughness:.7}),3.31);
  g.rotation.set(-.35,0,-.6);
  return g;
}
var OFF=V(2.5,3.2,-1),tmp=V(0,0,0);
var ease=function(k){k=Math.max(0,Math.min(1,k));return 1-Math.pow(1-k,3);};
var back=function(x){x=Math.max(0,Math.min(1,x));var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};

function build(i){
  var part=slides[i].b(),group=new THREE.Group();
  var paper=new THREE.Mesh(paperGeo,paperMat);paper.position.y=-.04;paper.receiveShadow=true;group.add(paper);
  var T=.9;
  part.strokes.forEach(function(s){s.start=T;T+=s.dur+.15;group.add(s.mesh);});
  var end=part.strokes.length?T-.15:.9;
  part.pops.forEach(function(p){group.add(p.w);});
  var pencil=makePencil();group.add(pencil);
  group.traverse(function(o){if(o.isMesh&&o!==paper)o.castShadow=true;});
  return {group:group,strokes:part.strokes,pops:part.pops,pencil:pencil,end:end,age:0};
}
var AC=null,sg=null,sf=null,soundOn=true;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{
    AC=new C();
    var len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    var src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    sf=AC.createBiquadFilter();sf.type='bandpass';sf.frequency.value=1400;sf.Q.value=.5;
    var hp=AC.createBiquadFilter();hp.type='lowpass';hp.frequency.value=2600;
    var am=AC.createGain();am.gain.value=.6;
    var lfo=AC.createOscillator();lfo.frequency.value=7;
    var lg=AC.createGain();lg.gain.value=.15;lfo.connect(lg);lg.connect(am.gain);lfo.start();
    sg=AC.createGain();sg.gain.value=0;
    src.connect(sf);sf.connect(hp);hp.connect(am);am.connect(sg);sg.connect(AC.destination);src.start();
  }catch(e){AC=null;}
}
function setScratch(a){return;
  if(!AC||!sg)return;
  sg.gain.setTargetAtTime(soundOn?a*.07:0,AC.currentTime,.08);
  sf.frequency.setTargetAtTime(1000+a*900,AC.currentTime,.1);
}
function ding(){
  if(!AC||!soundOn)return;
  var o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime;
  o.type='sine';o.frequency.value=660;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.04,t0+.05);g.gain.exponentialRampToValueAtTime(.0001,t0+1.2);
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+1);
}
addEventListener('pointerdown',initAudio);addEventListener('keydown',initAudio);

});
var now=0;
function upd(S,dt){
  S.age+=dt;var t=RM?999:S.age,st=S.strokes,P=S.pencil;
  st.forEach(function(s){
    var p=Math.min(1,Math.max(0,(t-s.start)/s.dur));s.e=.5-.5*Math.cos(Math.PI*p);
    s.mesh.geometry.setDrawRange(0,Math.floor(s.e*s.count/3)*3);
  });
  var act=0;
  st.forEach(function(s){var q=(t-s.start)/s.dur;if(q>0&&q<1)act=Math.sin(Math.PI*q)*.9+.1;});
  setScratch(RM?0:act);
  if(!st.length||RM){P.visible=false;}
  else{
    P.visible=t<S.end+1.2;
    if(t<st[0].start){tmp.copy(st[0].curve.getPointAt(0)).addScaledVector(OFF,1-ease(t/st[0].start));}
    else if(t>=S.end){tmp.copy(st[st.length-1].curve.getPointAt(1)).addScaledVector(OFF,ease((t-S.end)/1.1));}
    else{
      var i=0;for(var k=0;k<st.length;k++){if(st[k].start<=t)i=k;}
      var s=st[i];
      if(t<s.start+s.dur){tmp.copy(s.curve.getPointAt(s.e));}
      else{var nx=st[i+1]||s;tmp.copy(s.curve.getPointAt(1)).lerp(nx.curve.getPointAt(0),Math.min(1,(t-s.start-s.dur)/.15));}
    }
    P.position.copy(tmp);
  }
  S.pops.forEach(function(p,k){
    var pp=Math.min(1,Math.max(0,(t-(S.end-.1+k*.2))/.9));
    p.w.scale.setScalar(Math.max(back(pp),.0001));
    p.w.position.y=p.y+Math.sin(now*1.4+k)*.06*pp;
    if(p.spin&&pp>0)p.w.rotation.y=now*.5+k;
  });
}

function go(n){

function resize(){

var last=performance.now();
function frame(ts){
  var dt=Math.min(.05,(ts-last)/1000);last=ts;now+=dt;
  var d=Math.max(9,12.4/camera.aspect);
  camera.position.set(Math.sin(now*.2)*.8+mx*.9,.78*d-my*.5,.62*d);
  camera.lookAt(0,.2,.9);
  if(cur){
    upd(cur,dt);

      cur.rv=1;var rq=riddles[idx],rdEl=document.getElementById('rd');

      rdEl.className='riddle show';ding();
    }
    enter=Math.min(1,enter+dt/1.0);var e=ease(enter),g=cur.group;
    g.position.x=dirv*9*(1-e);g.rotation.y=-dirv*.6*(1-e);g.scale.setScalar(.85+.15*e);
  }
  if(prev){
    prev.age+=0;leave=Math.min(1,leave+dt/.8);var l=ease(leave),pg=prev.group;
    pg.position.x=-dirv*9*l;pg.rotation.y=dirv*.6*l;pg.scale.setScalar(1-.15*l);
    if(leave>=1){scene.remove(pg);prev=null;}
  }

}
go(0);
